name: Check and package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --prefix vscode-plugin install
      - run: npm test
      - run: npm run typecheck
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-plugin/pide-vscode.vsix
          if-no-files-found: error
